# B3 — endpointer ngữ nghĩa có sẵn, trọng số nguyên bản (ADR-0002). Chồng lên configs/default.yaml.
#
# videosdk-live/Namo-Turn-Detector-v1-Vietnamese, file model_quant.onnx + tokenizer.json,
# revision Hugging Face b9521d649636b6fb24408846e16364b399c8f9b6, Apache-2.0.
# ASR: Systran/faster-whisper-small (MIT), bản đã tải cho asr-check/. Chọn ASR cuối cùng ở GĐ 2
# theo số đo (ADR-0006 mục 5); đổi ASR là đổi B3, nên ghi tên ASR cạnh mọi số của B3.

turn:
  decider: semantic_onnx
  scorers: []
  # Cổng có tiếng / im lặng dùng chung cho cả bốn hệ (src/turnwise/turn/gate.py), để phép so
  # sánh đo phương pháp chứ không đo micro. Ngưỡng = max(floor_dbfs, nền ồn + margin_db).
  gate:
    # Sàn tuyệt đối: -45 dBFS là mức sàn ồn thường thấy của micro laptop trong phòng yên
    # (lựa chọn thiết kế từ GĐ 0).
    floor_dbfs: -45.0
    # Đo trên 18 bản thu thử, 2026-09-27 (configs/default.yaml, mục annotation): 12 dB.
    margin_db: 12.0
    # Heldner & Edlund (2010) §2.1.
    merge_ms: 180

  semantic_onnx:
    model_dir: models/namo-turn-detector-v1-vi
    asr_model_dir: asr-check/models/faster-whisper-small
    # asr-check/transcribe.py dùng beam 5.
    asr_beam_size: 5
    # Model card: nhãn là argmax của hai lớp, tức xác suất lớp "End of Turn" > 0,5.
    probability_threshold: 0.5
    # Cùng cách vận hành với B2, để B2 và B3 khác nhau đúng ở mô hình (pause_triggered.py).
    trigger_silence_ms: 200
    fallback_silence_ms: 3000
    pre_speech_ms: 500
    # Whisper nhận tới 30 giây; một lượt khách hiếm khi dài hơn.
    window_s: 30
