# Mọi số trên hoá đơn là giả. NetCo là công ty giả định (SPEC §3).
name: n1-a-outage-reading-number
flow: N1
title: Báo mất mạng, tìm số thuê bao trên hoá đơn
summary: >
  Khách báo mất mạng, phải tìm số thuê bao lẫn giữa các mã khác trên hoá đơn nên ngập ngừng
  thật (SPEC §10.1), kể lỗi bằng câu dài, chọn buổi hẹn bằng câu ngắn, ghi giờ hẹn ra giấy trong
  lúc bot đọc lại nên có tiếng đệm tự nhiên.
persona: Mạng nhà mất từ sáng, con đang cần học trực tuyến. Hoá đơn tháng trước để trên bàn.
props:
  customer_code: "KH 5530 2178"
  contract_no: "HĐ 0917 44"
  subscriber_id: "824 615 390"
brief: "Bạn gọi báo mạng nhà bị mất. Tổng đài sẽ hỏi số thuê bao, tình trạng modem, rồi hẹn kỹ thuật viên."
steps:
  - bot: "Tổng đài NetCo xin nghe. Quý khách cần hỗ trợ gì ạ?"
    example: "Alô, mạng nhà tôi mất từ sáng tới giờ, không vào được gì cả."
    customer: Nói là mạng ở nhà bị mất, bằng lời của mình.
  - bot: "Quý khách cho em xin số thuê bao in trên hoá đơn ạ."
    example: "Số thuê bao hả em, để tôi xem hoá đơn đã… (tìm rồi đọc số trên thẻ)"
    customer: >
      Số thuê bao nằm trên hoá đơn, lẫn với mã khách hàng và số hợp đồng. Cần tìm thì cứ nói với
      bot như khi gọi tổng đài thật, rồi tìm và đọc theo cách quen của mình.
    behaviours: [hesitation]
  - bot: "Em xin đọc lại: tám hai bốn / sáu một năm / ba chín không. Đúng không ạ?"
    reading: number
    example: "Dạ."
    customer: Nếu khớp với hoá đơn thì xác nhận ngắn; nếu khác thì sửa lại.
    behaviours: [short_answer]
    replies: ["Dạ.", "Đúng rồi.", "Dạ đúng.", "Ừ, đúng đấy."]
  - bot: "Quý khách mô tả giúp em tình trạng mạng, ví dụ đèn trên modem đang thế nào ạ?"
    example: "Từ sáng bật lên là không vào được. Đèn trên modem thì… (kể theo ý bạn)"
    customer: >
      Kể như kể với nhân viên thật: mất từ lúc nào, đèn modem ra sao, đã thử khởi động lại chưa.
      Nói bao nhiêu tuỳ ý.
    behaviours: [long_answer]
  - bot: "Kỹ thuật viên có thể qua vào sáng mai hoặc chiều mai. Quý khách chọn buổi nào ạ?"
    example: "Sáng mai."
    customer: Chọn một buổi.
    behaviours: [short_answer]
    replies: ["Sáng mai.", "Chiều.", "Sáng.", "Buổi nào cũng được."]
  - bot: >
      Em xác nhận lịch hẹn: / kỹ thuật viên đến vào sáng mai, / từ tám giờ đến mười một giờ, / tại
      địa chỉ đăng ký của thuê bao. / Trước khi đến khoảng ba mươi phút, / kỹ thuật viên sẽ gọi
      điện cho quý khách.
    reading: schedule
    example: "(Vừa ghi giờ hẹn ra giấy vừa nghe, đáp lời như khi nghe điện thoại)"
    customer: >
      Ghi giờ hẹn ra giấy trong lúc bot đọc. Nghe và đáp lời như khi nghe điện thoại bình thường;
      không ngắt lời.
    behaviours: [backchannel]
  - bot: "Quý khách còn cần hỗ trợ gì thêm không ạ?"
    example: "Không."
    customer: Trả lời là không cần gì nữa.
    behaviours: [short_answer]
    replies: ["Không.", "Không cần nữa.", "Hết rồi.", "Thôi, cảm ơn."]
  - bot: "Cảm ơn quý khách đã gọi tổng đài NetCo. Chúc quý khách một ngày tốt lành ạ."
    example: "Ừ, cảm ơn em nhé."
    customer: Chào lại như khi kết thúc một cuộc gọi thật, hoặc không nói gì cũng được.
