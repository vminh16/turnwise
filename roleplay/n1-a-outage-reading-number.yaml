# Mọi số trên thẻ là giả. NetCo là công ty giả định (SPEC §3).
name: n1-a-outage-reading-number
flow: N1
title: Báo mất mạng, đọc số thuê bao từ thẻ
summary: >
  Khách báo mất mạng, phải dò số thuê bao trên thẻ nên ngập ngừng giữa dãy số (SPEC §10.1),
  kể lỗi bằng câu dài, chọn khung giờ bằng câu ngắn, chêm tiếng đệm khi bot đọc lại lịch hẹn.
persona: Khách mất mạng từ sáng, hơi bực, đang cầm thẻ thuê bao.
props:
  subscriber_id: "824 615 390"
steps:
  - bot: "Dạ, tổng đài NetCo xin nghe. Quý khách cần hỗ trợ gì ạ?"
    customer: Nói là mạng ở nhà bị mất, bằng lời của mình.
  - bot: "Dạ, quý khách vui lòng đọc giúp em số thuê bao ạ."
    customer: >
      Đọc số trên thẻ. Đọc được ba bốn số thì dừng hẳn lại vài giây như đang dò tiếp trên thẻ,
      rồi đọc nốt. Không báo trước là mình sẽ dừng.
    behaviours: [hesitation]
  - bot: "Em xin đọc lại số thuê bao: tám hai bốn, sáu một năm, ba chín không. Đúng không ạ?"
    reading: number
    customer: Xác nhận bằng một câu ngắn.
    behaviours: [short_answer]
    replies: ["Đúng rồi.", "Vâng.", "Được.", "Đúng đấy."]
  - bot: "Dạ, quý khách mô tả giúp em tình trạng mạng hiện tại ạ."
    customer: >
      Kể lỗi thành một câu dài, ít nhất hai ý: mất từ lúc nào, đèn modem ra sao, đã thử khởi động
      lại chưa.
    behaviours: [long_answer]
  - bot: "Dạ, kỹ thuật viên có thể qua vào sáng mai hoặc chiều mai. Quý khách chọn khung giờ nào ạ?"
    customer: Chọn một khung giờ bằng một hai chữ.
    behaviours: [short_answer]
    replies: ["Sáng.", "Chiều.", "Sáng mai.", "Chiều nay không được, chiều mai."]
  - bot: >
      Em xin xác nhận lịch hẹn: kỹ thuật viên sẽ đến vào sáng mai, từ tám giờ đến mười một giờ,
      tại địa chỉ đăng ký của thuê bao tám hai bốn, sáu một năm, ba chín không. Kỹ thuật viên sẽ
      gọi điện cho quý khách trước khi đến khoảng ba mươi phút.
    reading: address
    customer: Trong lúc bot đọc, chêm "dạ" hoặc "vâng" một hai lần. Không ngắt lời.
    behaviours: [backchannel]
  - bot: "Quý khách còn cần hỗ trợ gì thêm không ạ?"
    customer: Trả lời là không cần gì nữa.
    behaviours: [short_answer]
    replies: ["Không.", "Thôi.", "Không cần nữa.", "Hết rồi."]
