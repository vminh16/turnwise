# Mọi số, tên gói và điều khoản là giả. NetCo là công ty giả định (SPEC §3).
name: n4-b-cancel-agent-request
flow: N4
title: Huỷ gói, đòi gặp nhân viên giữa lúc bot đọc điều khoản
summary: >
  Khách muốn huỷ gói, bot đọc điều khoản phí huỷ; khách nói đè đòi gặp nhân viên (SPEC §10.4, N5
  ưu tiên tuyệt đối).
persona: Chuyển sang nhà mạng khác vì chuyển nhà. Không nghĩ là phải trả phí huỷ.
props:
  subscriber_id: "731 458 062"
  plan: "Gói Gia Đình"
steps:
  - bot: "Tổng đài NetCo xin nghe. Quý khách cần hỗ trợ gì ạ?"
    customer: Nói ngắn là muốn huỷ gói.
    behaviours: [short_answer]
    replies: ["Tôi muốn huỷ.", "Huỷ gói.", "Huỷ mạng.", "Cắt hợp đồng."]
  - bot: "Quý khách cho em xin số thuê bao ạ."
    example: "(Đọc số thuê bao trên thẻ)"
    customer: Đọc số trên hoá đơn.
  - bot: "Quý khách cho em hỏi lý do huỷ gói để em ghi nhận ạ."
    example: "À, nhà tôi sắp chuyển… (kể lý do theo ý bạn)"
    customer: Giải thích lý do bằng lời của mình; cứ vừa nghĩ vừa nói.
    behaviours: [long_answer, hesitation]
  - bot: >
      Em xin đọc điều khoản huỷ Gói Gia Đình. / Thuê bao đang trong thời gian cam kết mười hai tháng,
      / đã sử dụng bảy tháng. / Nếu huỷ trước hạn, / quý khách thanh toán phí huỷ bằng năm tháng cước
      còn lại, / tổng cộng một triệu hai trăm năm mươi nghìn đồng. / Modem cần hoàn trả trong vòng
      mười lăm ngày.
    reading: terms
    example: "Ơ em ơi, sao lại phải trả phí huỷ? Thôi cho tôi nói chuyện với nhân viên."
    customer: >
      Bạn không đồng ý trả phí huỷ. Nghe tới phí huỷ thì bảo bot cho gặp nhân viên. Muốn nói lúc
      nào thì nói. Ngắt lời như với một nhân viên thật.
    behaviours: [agent_request]
  - bot: "Em chuyển máy cho nhân viên hỗ trợ ngay để trao đổi về phí huỷ. Quý khách không cần nhắc lại thông tin đã cung cấp ạ."
    example: "Ừ."
    customer: Chờ được chuyển máy như khi gọi thật; muốn nói gì hay im lặng đều được.
