# Mọi số, tên gói và điều khoản là giả. NetCo là công ty giả định (SPEC §3).
name: n4-a-plan-terms-backchannel
flow: N4
title: Đăng ký gói, nghe bot đọc điều khoản
summary: >
  Bot bắt buộc đọc điều khoản trước khi đăng ký, có chỗ ngắt sau từng điều; khách đáp lời trong lúc
  nghe (R4), rồi xác nhận rõ ràng (SPEC §4.2, im lặng không phải đồng ý).
persona: Muốn nâng gói nhanh hơn vì con học trực tuyến và cả nhà dùng chung mạng.
props:
  customer_code: "KH 7702 9314"
  subscriber_id: "248 630 915"
  plan: "Gói Tốc Độ 300"
steps:
  - bot: "Tổng đài NetCo xin nghe. Quý khách cần hỗ trợ gì ạ?"
    example: "Chào em, tôi muốn nâng gói Internet. Dạo này cả nhà dùng chung nên mạng chậm lắm."
    customer: Nói muốn nâng gói Internet và lý do, bằng lời của mình.
    behaviours: [long_answer]
  - bot: "Quý khách cho em xin số thuê bao in trên hoá đơn ạ."
    example: "Số thuê bao hả, chờ tôi xíu… (tìm trên hoá đơn rồi đọc)"
    customer: >
      Số thuê bao nằm trên hoá đơn cùng mã khách hàng. Tìm và đọc; cần thì bảo bot chờ.
    behaviours: [hesitation]
  - bot: "Hiện có gói Tốc Độ ba trăm và gói Tốc Độ năm trăm. Quý khách chọn gói nào ạ?"
    customer: Chọn gói ghi trên thẻ.
    behaviours: [short_answer]
    replies: ["Ba trăm.", "Gói ba trăm.", "Gói nhỏ.", "Cái rẻ hơn."]
  - bot: >
      Em xin đọc điều khoản gói Tốc Độ ba trăm. / Cước hằng tháng ba trăm hai mươi nghìn đồng. / Cam
      kết sử dụng tối thiểu mười hai tháng. / Nếu huỷ trước thời hạn cam kết, / quý khách thanh toán
      phí huỷ bằng hai tháng cước. / Gói có hiệu lực từ kỳ cước tiếp theo, / gói hiện tại giữ nguyên
      đến hết kỳ này.
    reading: terms
    customer: >
      Nghe điều khoản như khi nghe tổng đài thật và đáp lời theo thói quen của mình; không ngắt lời.
    behaviours: [backchannel]
  - bot: "Quý khách xác nhận đăng ký gói Tốc Độ ba trăm với các điều khoản trên chứ ạ?"
    customer: Xác nhận rõ ràng bằng một câu ngắn.
    behaviours: [short_answer]
    replies: ["Dạ đồng ý.", "Xác nhận.", "Đăng ký.", "Ừ, được."]
  - bot: >
      Em đã đăng ký gói Tốc Độ ba trăm cho quý khách, gói có hiệu lực từ kỳ cước tiếp theo. Quý
      khách còn cần hỗ trợ gì thêm không ạ?
    customer: Trả lời là không cần gì nữa.
    behaviours: [short_answer]
    replies: ["Không ạ.", "Vậy được rồi.", "Thế là đủ.", "Không có gì nữa."]
  - bot: "Cảm ơn quý khách đã tin dùng NetCo. Chúc quý khách một ngày tốt lành ạ."
    example: "Cảm ơn em."
    customer: Chào lại như khi kết thúc một cuộc gọi thật, hoặc không nói gì cũng được.
