# Mọi số trên hoá đơn là giả. NetCo là công ty giả định (SPEC §3).
name: n1-b-outage-barge-in
flow: N1
title: Báo mất mạng, ngắt lời khi bot hướng dẫn lại việc đã làm
summary: >
  Bot đọc hướng dẫn khởi động lại modem mà khách đã tự làm hai lần; khách nói đè có nội dung để
  bot dừng (SPEC §4.3, R3). Có ngập ngừng khi nhớ giờ mất mạng.
persona: >
  Đã tự rút điện modem hai lần từ tối qua mà không được. Đây là lần thứ hai gọi tổng đài về
  chuyện này.
props:
  subscriber_id: "307 942 186"
steps:
  - bot: "Tổng đài NetCo xin nghe. Quý khách cần hỗ trợ gì ạ?"
    customer: Báo mạng chập chờn rồi mất hẳn.
  - bot: "Quý khách cho em xin số thuê bao ạ."
    customer: Đọc số trên hoá đơn.
  - bot: "Mạng bắt đầu mất từ khoảng mấy giờ ạ?"
    customer: Nhớ lại rồi trả lời. Không chắc thì cứ vừa nghĩ vừa nói.
    behaviours: [hesitation]
  - bot: >
      Trước tiên, quý khách vui lòng thử các bước sau: / rút dây nguồn của modem ra, / chờ khoảng
      ba mươi giây, / cắm lại dây nguồn, / sau đó chờ thêm hai phút đến khi đèn Internet sáng xanh
      ổn định, / rồi kiểm tra lại kết nối.
    reading: terms
    customer: >
      Bạn đã làm đúng các bước này hai lần rồi. Khi nhận ra bot đang hướng dẫn lại, nói cho bot
      biết. Muốn nói lúc nào thì nói, không cần chờ bot đọc xong. Ngắt lời như với một nhân viên thật.
    behaviours: [barge_in]
  - bot: "Dạ, em xin lỗi. Em đặt lịch kỹ thuật viên qua kiểm tra. Quý khách muốn hẹn ngày nào ạ?"
    customer: Chọn ngày.
    behaviours: [short_answer]
    replies: ["Hôm nay.", "Mai.", "Thứ bảy.", "Càng sớm càng tốt."]
  - bot: "Quý khách xác nhận đặt lịch hẹn này chứ ạ?"
    customer: Đồng ý bằng một câu ngắn.
    behaviours: [short_answer]
    replies: ["Dạ.", "Có.", "Đồng ý.", "Được."]
  - bot: "Em đã đặt lịch cho quý khách. Em xin lỗi vì quý khách phải gọi lại lần này. Cảm ơn quý khách đã gọi tổng đài NetCo ạ."
    customer: Chào lại như khi kết thúc một cuộc gọi thật, hoặc không nói gì cũng được.
