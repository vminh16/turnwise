# NetCo là công ty giả định (SPEC §3).
name: n5-a-agent-first
flow: N5
title: Gặp nhân viên, nói đè ngay từ lời chào
summary: >
  Khách đòi gặp người thật khi bot còn đang chào (N5 ở điểm sớm nhất). Lời chào dài để có chỗ nói
  đè; nếu bot hỏi lại, khách trả lời ngắn.
persona: Khách đã quen gọi tổng đài, không muốn nói chuyện với máy.
steps:
  - bot: >
      Dạ, tổng đài NetCo xin nghe. Để được hỗ trợ nhanh hơn, quý khách vui lòng cho biết nhu cầu:
      báo sự cố mạng, tra cứu cước, đổi lịch hẹn kỹ thuật viên, hoặc đăng ký và huỷ gói cước.
    reading: terms
    customer: Không đợi bot đọc hết, nói đè đòi gặp nhân viên, bằng lời của mình.
    behaviours: [agent_request]
  - bot: "Dạ, quý khách cho em hỏi quý khách cần hỗ trợ về vấn đề gì để em chuyển đúng bộ phận ạ?"
    customer: Trả lời ngắn một chủ đề bất kỳ.
    behaviours: [short_answer]
    replies: ["Cước.", "Mạng.", "Lịch hẹn.", "Chuyện gói cước."]
