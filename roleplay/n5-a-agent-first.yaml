# NetCo là công ty giả định (SPEC §3).
name: n5-a-agent-first
flow: N5
title: Gặp nhân viên, nói đè ngay từ lời chào
summary: >
  Khách đòi gặp người thật khi bot còn đang đọc danh sách dịch vụ (N5 ở điểm sớm nhất). Nếu bot hỏi
  lại để chuyển đúng bộ phận, khách trả lời ngắn.
persona: Chỉ muốn nói chuyện với người thật, không muốn nghe máy đọc danh sách.
steps:
  - bot: >
      Tổng đài NetCo xin nghe. / Để được hỗ trợ nhanh hơn, quý khách vui lòng cho biết nhu cầu: /
      báo sự cố mạng, / tra cứu cước, / đổi lịch hẹn kỹ thuật viên, / hoặc đăng ký và huỷ gói cước.
    reading: terms
    customer: >
      Bạn chỉ muốn gặp người thật. Nói ra lúc nào tuỳ ý, không cần chờ bot đọc hết.
      Ngắt lời như với một nhân viên thật.
    behaviours: [agent_request]
  - bot: "Quý khách cần hỗ trợ về vấn đề gì để em chuyển đúng bộ phận ạ?"
    customer: Trả lời ngắn một chủ đề bất kỳ.
    behaviours: [short_answer]
    replies: ["Cước.", "Mạng.", "Lịch hẹn.", "Khiếu nại."]
  - bot: "Em chuyển máy cho nhân viên hỗ trợ ngay, quý khách vui lòng giữ máy ạ."
    customer: Chờ được chuyển máy như khi gọi thật; muốn nói gì hay im lặng đều được.
