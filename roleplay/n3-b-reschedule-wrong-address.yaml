# Mọi địa chỉ và mã là giả. NetCo là công ty giả định (SPEC §3).
name: n3-b-reschedule-wrong-address
flow: N3
title: Đổi lịch hẹn, bot đọc địa chỉ cũ
summary: >
  Phép thử SPEC §10.3: khách nói đè để sửa khi bot đọc địa chỉ cũ. Khách đọc địa chỉ mới và giải
  thích bằng câu dài.
persona: Vừa chuyển nhà tuần trước; lịch hẹn cũ vẫn ghi địa chỉ cũ.
props:
  appointment_code: "L 81 36 05"
  old_address: "số 12 ngõ 45 đường Hoa Sữa"
  new_address: "số 8 ngõ 17 đường Hoa Mai"
steps:
  - bot: "Tổng đài NetCo xin nghe. Quý khách cần hỗ trợ gì ạ?"
    customer: Nói muốn kiểm tra lại lịch hẹn kỹ thuật viên.
  - bot: "Quý khách cho em xin mã lịch hẹn ạ."
    customer: Đọc mã trên thẻ.
  - bot: >
      Lịch hẹn của quý khách: / kỹ thuật viên đến vào sáng thứ sáu, / từ tám giờ đến mười giờ, / tại
      số mười hai, ngõ bốn mươi lăm, đường Hoa Sữa. / Kỹ thuật viên sẽ mang theo modem mới để thay.
    reading: address
    customer: >
      Địa chỉ bot đọc là nhà cũ. Sửa lại ngay khi nhận ra, không cần chờ bot đọc xong.
    behaviours: [barge_in]
  - bot: "Dạ, em xin lỗi. Quý khách cho em xin địa chỉ mới ạ."
    customer: Đọc địa chỉ mới trên thẻ và nói thêm là vừa chuyển nhà, bằng lời của mình.
    behaviours: [long_answer]
  - bot: "Quý khách vẫn giữ khung giờ sáng thứ sáu chứ ạ?"
    customer: Trả lời ngắn.
    behaviours: [short_answer]
    replies: ["Dạ.", "Giữ lịch cũ.", "Vẫn giữ.", "Giữ nguyên."]
  - bot: "Em đã cập nhật địa chỉ mới cho lịch hẹn sáng thứ sáu. Cảm ơn quý khách đã gọi tổng đài NetCo ạ."
    customer: Chào lại như khi kết thúc một cuộc gọi thật, hoặc không nói gì cũng được.
