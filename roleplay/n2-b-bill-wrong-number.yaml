# Mọi số trên hoá đơn là giả. NetCo là công ty giả định (SPEC §3).
name: n2-b-bill-wrong-number
flow: N2
title: Tra cước, bot đọc lại sai số thuê bao
summary: >
  Bot cố ý đọc lại một số thuê bao khác với hoá đơn; khách nói đè để sửa (R3). Sau đó khách đòi
  gặp nhân viên giữa lúc bot đọc số tiền (N5 ở giữa luồng, SPEC §4.2).
persona: Đang vội. Tháng trước đã thanh toán đúng hạn qua ứng dụng.
props:
  subscriber_id: "662 190 537"
brief: "Bạn đang vội, gọi tra cước tháng này. Nghe kỹ những gì tổng đài đọc lại."
steps:
  - bot: "Tổng đài NetCo xin nghe. Quý khách cần hỗ trợ gì ạ?"
    example: "Em ơi, tôi muốn tra cước tháng này."
    customer: Nói muốn tra cước tháng này.
  - bot: "Quý khách cho em xin số thuê bao ạ."
    example: "(Đọc số thuê bao trên thẻ)"
    customer: Đọc số trên hoá đơn.
  - bot: >
      Em xin đọc lại số thuê bao: / sáu sáu hai / một chín không / năm bảy ba. / Em tra cước cho số
      này nhé.
    reading: number
    example: "À không em ơi, số đó sai rồi… (đọc lại số đúng)"
    customer: >
      Số bot đọc khác với hoá đơn. Sửa lại cho bot ngay khi nhận ra, không cần chờ bot đọc xong.
      Ngắt lời như với một nhân viên thật.
    behaviours: [barge_in]
  - bot: "Dạ, em xin lỗi. Quý khách xác nhận giúp em ba số cuối là năm ba bảy đúng không ạ?"
    example: "Dạ."
    customer: Xác nhận ngắn.
    behaviours: [short_answer]
    replies: ["Dạ.", "Đúng rồi.", "Phải.", "Ừ."]
  - bot: >
      Cước tháng này của quý khách là bốn trăm mười hai nghìn đồng, / trong đó có phí đóng muộn kỳ
      trước năm mươi nghìn đồng. / Hạn thanh toán là ngày hai mươi lăm. / Quý khách có thể thanh
      toán qua ứng dụng NetCo / hoặc tại các điểm giao dịch.
    reading: amount
    example: "Khoan đã em, tháng trước tôi đóng đúng hạn rồi mà. Cho tôi gặp nhân viên."
    customer: >
      Nghe tới khoản phí đóng muộn thì bảo bot cho gặp nhân viên. Muốn nói lúc nào thì nói.
      Ngắt lời như với một nhân viên thật.
    behaviours: [agent_request]
  - bot: "Em chuyển máy cho nhân viên hỗ trợ ngay. Quý khách không cần nhắc lại thông tin đã cung cấp ạ."
    example: "Ừ."
    customer: Chờ được chuyển máy như khi gọi thật; muốn nói gì hay im lặng đều được.
