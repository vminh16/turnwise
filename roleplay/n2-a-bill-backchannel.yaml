# Mọi số trên hoá đơn là giả. NetCo là công ty giả định (SPEC §3).
name: n2-a-bill-backchannel
flow: N2
title: Tra cước, ghi lại từng khoản trong lúc bot đọc
summary: >
  Bot đọc chi tiết cước theo từng khoản có chỗ ngắt; khách ghi ra giấy nên đáp lời tự nhiên mà bot
  phải đọc tiếp (SPEC §10.2, R4). Khách ngập ngừng khi chọn tháng cần tra.
persona: Cước tháng này cao hơn mọi tháng. Muốn nghe rõ từng khoản để so với hoá đơn.
props:
  subscriber_id: "519 083 274"
brief: "Bạn gọi tra cước vì tháng này cao bất thường. Tổng đài sẽ đọc từng khoản; bạn ghi ra giấy để so."
steps:
  - bot: "Tổng đài NetCo xin nghe. Quý khách cần hỗ trợ gì ạ?"
    example: "Chào em, tôi muốn kiểm tra cước tháng này."
    customer: Nói muốn kiểm tra cước.
  - bot: "Quý khách cho em xin số thuê bao ạ."
    example: "(Đọc số thuê bao trên thẻ)"
    customer: Đọc số trên hoá đơn.
  - bot: "Quý khách muốn tra cước tháng nào ạ?"
    example: "Tháng… (chọn tháng muốn tra)"
    customer: Trả lời tháng muốn tra. Chưa chắc thì cứ vừa nghĩ vừa nói; đổi ý cũng được.
    behaviours: [hesitation]
  - bot: >
      Cước tháng tám của quý khách gồm: / cước gói Internet cơ bản hai trăm bốn mươi chín nghìn
      đồng; / phí thuê thiết bị phát sóng ba mươi nghìn đồng; / phí truyền hình bổ sung sáu mươi lăm
      nghìn đồng. / Tổng cộng ba trăm bốn mươi bốn nghìn đồng, / đã bao gồm VAT.
    reading: amount
    example: "(Vừa ghi từng khoản ra giấy vừa nghe, đáp lời như khi nghe điện thoại)"
    customer: >
      Ghi từng khoản ra giấy trong lúc bot đọc. Nghe và đáp lời như khi nghe điện thoại bình
      thường; không ngắt lời.
    behaviours: [backchannel]
  - bot: "Quý khách có thắc mắc về khoản nào không ạ?"
    example: "Cái khoản truyền hình bổ sung ấy, tôi không nhớ là có đăng ký bao giờ. Em xem giúp tôi với."
    customer: >
      Bạn không nhớ đã đăng ký truyền hình bổ sung. Hỏi bot về khoản đó bằng lời của mình.
    behaviours: [long_answer]
  - bot: "Quý khách có muốn em gửi chi tiết cước qua tin nhắn không ạ?"
    example: "Dạ có."
    customer: Trả lời ngắn.
    behaviours: [short_answer]
    replies: ["Dạ có.", "Có ạ.", "Phải.", "Khỏi."]
  - bot: "Em đã ghi nhận yêu cầu của quý khách. Cảm ơn quý khách đã gọi tổng đài NetCo, chúc quý khách một ngày tốt lành ạ."
    example: "Cảm ơn em."
    customer: Chào lại như khi kết thúc một cuộc gọi thật, hoặc không nói gì cũng được.
