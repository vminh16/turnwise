# Mọi mã và tin nhắn trên thẻ là giả. NetCo là công ty giả định (SPEC §3).
name: n3-a-reschedule-code
flow: N3
title: Đổi lịch hẹn, tìm mã lịch hẹn trong tin nhắn
summary: >
  Khách tìm mã lịch hẹn giữa nhiều dòng tin nhắn nên ngập ngừng thật, chọn ngày và buổi bằng câu
  ngắn, xác nhận trước khi bot ghi nhận thay đổi (SPEC §4.2). Ghi lịch mới ra giấy trong lúc bot đọc.
persona: Có việc đột xuất vào ngày đã hẹn, cần dời lịch kỹ thuật viên.
props:
  sms: >
    NetCo: Lich hen lap dat cua Quy khach vao 09:00 thu Ba. Ma lich hen: L 47 20 93. Ky thuat vien
    se goi truoc 30 phut. Tong dai ho tro 24/7.
  appointment_code: "L 47 20 93"
brief: "Bạn gọi dời lịch hẹn kỹ thuật viên. Mã lịch hẹn nằm trong tin nhắn trên thẻ."
steps:
  - bot: "Tổng đài NetCo xin nghe. Quý khách cần hỗ trợ gì ạ?"
    example: "Chào em, tôi muốn đổi lịch hẹn kỹ thuật viên."
    customer: Nói muốn đổi lịch hẹn kỹ thuật viên.
  - bot: "Quý khách cho em xin mã lịch hẹn trong tin nhắn xác nhận ạ."
    example: "Mã lịch hẹn à, em chờ tôi một chút… (tìm mã trong tin nhắn trên thẻ)"
    customer: >
      Mã nằm trong tin nhắn in trên thẻ, giữa nhiều chữ khác. Tìm và đọc; cần thì bảo bot chờ.
    behaviours: [hesitation]
  - bot: "Quý khách muốn dời sang ngày nào ạ?"
    example: "Thứ năm."
    customer: Nói ngày mới.
    behaviours: [short_answer]
    replies: ["Thứ năm.", "Chủ nhật.", "Tuần sau.", "Ngày kia."]
  - bot: "Quý khách chọn buổi sáng hay buổi chiều ạ?"
    example: "Sáng."
    customer: Chọn một buổi.
    behaviours: [short_answer]
    replies: ["Sáng.", "Chiều.", "Buổi chiều.", "Sáng sớm."]
  - bot: >
      Em đọc lại lịch hẹn mới: / thứ năm tuần này, buổi chiều, / từ một giờ ba mươi đến bốn giờ ba
      mươi. / Địa chỉ giữ nguyên như lịch hẹn cũ.
    reading: schedule
    example: "(Vừa ghi lịch mới ra giấy vừa nghe, đáp lời như khi nghe điện thoại)"
    customer: >
      Ghi lịch mới ra giấy trong lúc bot đọc. Nghe và đáp lời như khi nghe điện thoại bình thường;
      không ngắt lời.
    behaviours: [backchannel]
  - bot: "Quý khách xác nhận đổi sang lịch hẹn mới này chứ ạ?"
    example: "Dạ vâng."
    customer: Đồng ý bằng một câu ngắn.
    behaviours: [short_answer]
    replies: ["Dạ vâng.", "Đồng ý.", "Được ạ.", "Chốt."]
  - bot: >
      Em đã đổi lịch thành công. Kỹ thuật viên sẽ gọi cho quý khách khoảng ba mươi phút trước khi
      đến. Quý khách còn cần hỗ trợ gì thêm không ạ?
    example: "Không có gì nữa."
    customer: Trả lời là không cần gì nữa.
    behaviours: [short_answer]
    replies: ["Không có gì nữa.", "Hết rồi ạ.", "Thế thôi.", "Không, cảm ơn em."]
  - bot: "Cảm ơn quý khách đã gọi tổng đài NetCo. Chúc quý khách một ngày tốt lành ạ."
    example: "Cảm ơn em nhé."
    customer: Chào lại như khi kết thúc một cuộc gọi thật, hoặc không nói gì cũng được.
