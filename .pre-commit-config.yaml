# Chạy: uv run pre-commit install   (một lần cho mỗi bản clone)
# Chạy thủ công toàn bộ: uv run pre-commit run --all-files
default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict     # quan trọng trên Windows: hệ file không phân biệt hoa thường
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-added-large-files
        args: [--maxkb=512]         # audio và checkpoint không được vào git

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict on src/turnwise)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
